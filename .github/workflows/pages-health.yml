name: pages-health

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  mockups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check mockup pages and disclaimers
        run: python scripts/check_pages.py
